<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👑 Vương Quốc Nhật Ký Công Chúa ✨</title>
  
  <!-- Font chữ & Icon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            princess: {
              50: '#fff0f5',
              100: '#ffe4e1',
              200: '#ffccd5',
              300: '#ffb3c1',
              400: '#ff809b',
              500: '#ff4d6d',
              accent: '#ffb703',
              dark: '#590d22'
            }
          },
          fontFamily: {
            cute: ['Quicksand', 'sans-serif'],
            hand: ['Dancing Script', 'cursive'],
            bubble: ['Comfortaa', 'cursive']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(135deg, #fff0f5 0%, #ffdde1 50%, #ee9ca7 100%);
      min-height: 100vh;
    }
    .princess-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 2px solid #ffccd5;
      box-shadow: 0 10px 25px -5px rgba(255, 128, 155, 0.25);
    }
    .diary-note {
      background: #ffffff;
      border: 2px dashed #ffccd5;
      transition: all 0.3s ease;
    }
    .diary-note:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -3px rgba(255, 77, 109, 0.2);
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
    }
    .heart-bg {
      position: fixed;
      bottom: -20px;
      user-select: none;
      pointer-events: none;
      animation: float 12s linear infinite;
      z-index: 0;
      color: rgba(255, 128, 155, 0.3);
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body class="font-cute text-gray-700 relative overflow-x-hidden pb-16">

  <!-- Background Animated Icons -->
  <div class="heart-bg text-2xl" style="left: 10%; animation-duration: 8s;">🌸</div>
  <div class="heart-bg text-3xl" style="left: 25%; animation-duration: 12s; animation-delay: 2s;">💖</div>
  <div class="heart-bg text-xl" style="left: 55%; animation-duration: 10s; animation-delay: 4s;">✨</div>
  <div class="heart-bg text-3xl" style="left: 80%; animation-duration: 14s; animation-delay: 1s;">🎀</div>

  <div class="max-w-3xl mx-auto px-4 pt-10 relative z-10">

    <!-- Header -->
    <header class="text-center mb-10">
      <div class="inline-block animate-bounce mb-2">
        <span class="text-5xl">👑</span>
      </div>
      <h1 class="text-4xl md:text-5xl font-hand font-bold text-princess-500 drop-shadow-sm">
        Princess Secret Diary
      </h1>
      <p class="mt-2 text-sm md:text-base text-princess-dark font-medium">
        ✨ Gửi gắm một mẩu tâm tư, niềm vui hay lời chúc ngọt ngào vào đây nhé! 🎀
      </p>
    </header>

    <!-- Form viết nhật ký -->
    <div class="princess-card rounded-3xl p-6 md:p-8 mb-12 relative">
      <div class="absolute -top-4 right-8 bg-princess-400 text-white text-xs px-3 py-1 rounded-full font-bold shadow">
        📝 Viết thư gửi công chúa
      </div>

      <form id="diaryForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-princess-500 mb-1">
            🌸 Tên của bạn / Biệt danh đáng yêu
          </label>
          <input 
            type="text" 
            id="authorInput" 
            required
            placeholder="Ví dụ: Nàng Thơ, Bé Dâu Tây, Hoàng Tử..." 
            class="w-full px-4 py-3 rounded-2xl border-2 border-princess-200 focus:border-princess-400 focus:outline-none bg-white/90 text-sm transition"
          >
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-princess-500 mb-1">
            🎀 Cảm xúc lúc này
          </label>
          <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 text-xs font-medium">
            <label class="cursor-pointer">
              <input type="radio" name="mood" value="💖 Ngọt ngào" checked class="peer hidden">
              <div class="p-2 text-center rounded-xl border border-princess-200 peer-checked:bg-princess-200 peer-checked:border-princess-400 peer-checked:font-bold transition">
                💖 Ngọt ngào
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="mood" value="✨ Hạnh phúc" class="peer hidden">
              <div class="p-2 text-center rounded-xl border border-princess-200 peer-checked:bg-princess-200 peer-checked:border-princess-400 peer-checked:font-bold transition">
                ✨ Hạnh phúc
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="mood" value="🌸 Chill chill" class="peer hidden">
              <div class="p-2 text-center rounded-xl border border-princess-200 peer-checked:bg-princess-200 peer-checked:border-princess-400 peer-checked:font-bold transition">
                🌸 Chill chill
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="mood" value="💭 Mơ mộng" class="peer hidden">
              <div class="p-2 text-center rounded-xl border border-princess-200 peer-checked:bg-princess-200 peer-checked:border-princess-400 peer-checked:font-bold transition">
                💭 Mơ mộng
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="mood" value="🌙 Tâm sự" class="peer hidden">
              <div class="p-2 text-center rounded-xl border border-princess-200 peer-checked:bg-princess-200 peer-checked:border-princess-400 peer-checked:font-bold transition">
                🌙 Tâm sự
              </div>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-princess-500 mb-1">
            💌 Lời nhắn gửi / Trang nhật ký
          </label>
          <textarea 
            id="messageInput" 
            rows="3" 
            required
            placeholder="Hôm nay trời đẹp lắm, chúc công chúa luôn rạng rỡ và yêu đời nhen..." 
            class="w-full px-4 py-3 rounded-2xl border-2 border-princess-200 focus:border-princess-400 focus:outline-none bg-white/90 text-sm transition"
          ></textarea>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full py-3.5 bg-gradient-to-r from-princess-400 to-princess-500 hover:from-princess-500 hover:to-princess-400 text-white font-bold rounded-2xl shadow-lg shadow-princess-300 transform active:scale-98 transition duration-200 flex items-center justify-center space-x-2"
        >
          <span>Gửi Ngay Vào Nhật Ký</span>
          <span>💖</span>
        </button>
      </form>
    </div>

    <!-- Danh sách nhật ký -->
    <div>
      <div class="flex items-center justify-between mb-6 px-2">
        <h2 class="text-xl font-bold text-princess-dark flex items-center gap-2">
          <span>📖 Hộp Thư Kỷ Niệm</span>
          <span id="postCount" class="text-xs bg-princess-200 text-princess-500 px-2.5 py-0.5 rounded-full font-bold">0</span>
        </h2>
        <span class="text-xs text-princess-400">Tự động cập nhật tức thì ✨</span>
      </div>

      <div id="postsList" class="space-y-4">
        <div class="text-center py-12 text-princess-400 font-medium">
          <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
          <p class="text-sm">Đang mở hộp thư bí mật...</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-16 text-xs text-princess-dark/60">
      <p>Made with 💖 for sweet memories | Hosted on GitHub Pages</p>
    </footer>
  </div>

  <script>
    // =========================================================================
    // CẤU HÌNH CHUẨN XÁC FIREBASE CHO PRINCESSMEOMEO (SERVER SINGAPORE)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyApXsxyEbrH9W30KVyINT9_H3VXqP8Ko5Y",
      authDomain: "princessmeomeo.firebaseapp.com",
      databaseURL: "https://princessmeomeo-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "princessmeomeo",
      storageBucket: "princessmeomeo.firebasestorage.app",
      messagingSenderId: "240385247065",
      appId: "1:240385247065:web:8c69b3f83dadce03c06e48",
      measurementId: "G-L4L79M7BMQ"
    };

    // Khởi tạo Firebase Realtime Database
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const diaryForm = document.getElementById('diaryForm');
    const postsList = document.getElementById('postsList');
    const postCount = document.getElementById('postCount');

    function formatDate(timestamp) {
      const d = new Date(timestamp);
      return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')} • ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
    }

    function renderPosts(posts) {
      postsList.innerHTML = '';
      const keys = Object.keys(posts || {}).reverse();
      postCount.textContent = keys.length;

      if (keys.length === 0) {
        postsList.innerHTML = `
          <div class="text-center py-12 bg-white/60 rounded-3xl border border-princess-200 p-8 shadow-sm">
            <p class="text-4xl mb-2">💌</p>
            <p class="text-sm font-semibold text-princess-400">Chưa có lá thư nào ở đây...</p>
            <p class="text-xs text-gray-500 mt-1">Hãy là người đầu tiên viết vào nhật ký này nhé!</p>
          </div>
        `;
        return;
      }

      keys.forEach(key => {
        const item = posts[key];
        const card = document.createElement('div');
        card.className = "diary-note rounded-3xl p-5 relative overflow-hidden";
        
        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-princess-100 pb-2 mb-3">
            <div class="flex items-center space-x-2">
              <span class="w-8 h-8 rounded-full bg-princess-100 flex items-center justify-center text-sm">👑</span>
              <div>
                <h3 class="font-bold text-sm text-princess-dark">${escapeHtml(item.author)}</h3>
                <span class="text-[10px] text-gray-400">${formatDate(item.createdAt)}</span>
              </div>
            </div>
            <span class="text-xs bg-princess-50 text-princess-500 border border-princess-200 px-2.5 py-1 rounded-full font-medium">
              ${escapeHtml(item.mood || '💖')}
            </span>
          </div>
          <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-line">${escapeHtml(item.message)}</p>
        `;
        postsList.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Lắng nghe dữ liệu realtime
    db.ref('diary_entries').on('value', (snapshot) => {
      const data = snapshot.val();
      renderPosts(data);
    }, (error) => {
      console.error("Lỗi đọc dữ liệu:", error);
      postsList.innerHTML = `<div class="text-center py-6 text-xs text-red-500 bg-red-50 rounded-2xl p-4">Lỗi kết nối cơ sở dữ liệu: Vui lòng kiểm tra tab Rules trên Firebase đã đặt true chưa!</div>`;
    });

    // Xử lý gửi bài
    diaryForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const author = document.getElementById('authorInput').value.trim();
      const message = document.getElementById('messageInput').value.trim();
      const mood = document.querySelector('input[name="mood"]:checked').value;

      if (!author || !message) return;

      const newEntry = {
        author: author,
        message: message,
        mood: mood,
        createdAt: Date.now()
      };

      db.ref('diary_entries').push(newEntry).then(() => {
        diaryForm.reset();
      }).catch((err) => {
        alert("Lỗi khi gửi bài: " + err.message);
      });
    });
  </script>
</body>
</html>
