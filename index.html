  <script>

          colors: {

              primary: '#c08081', // Dusty Rose - Màu chủ đạo
              primaryHover: '#a66a6b', // Màu khi hover

  <style>
    body {
      background-color: #D5AAAA;
      /* Phủ thêm một lớp filter ánh sáng trắng cực nhẹ ở góc trên để màn hình có chiều sâu, không bị bệt màu */
      background-image: 
        radial-gradient(at 50% 0%, rgba(255, 255, 255, 0.2) 0px, transparent 75%),
        radial-gradient(at 100% 100%, rgba(0, 0, 0, 0.02) 0px, transparent 50%);
      color: #4A3C3D;
      min-height: 100vh;
    }

    .glass-bar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .chat-bubble {
      box-shadow: 0 4px 16px -3px rgba(74, 60, 61, 0.06);
      transition: transform 0.15s ease;
    }

    /* Checkbox cho To-Do - Phóng to size */
    .chat-checkbox {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 1.5px solid #c08081;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      margin-top: 2px;
    }
    .chat-checkbox:checked {
      background-color: #c08081;
      border-color: #c08081;
    }
    .chat-checkbox:checked::after {
      content: '✓';
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    @keyframes capooWiggle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(4deg); }
    }
    .capoo-anim {
      animation: capooWiggle 3s ease-in-out infinite;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body class="font-sans antialiased pb-48 selection:bg-app-primary/30">

  <!-- Top Sticky Navigation & Dual Clocks -->
  <nav class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-app-border px-5 py-3 shadow-sm">
    <div class="max-w-3xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Dual Real-time Clocks (Hà Nội vs Paris) -->
      <div class="flex items-center space-x-3 text-sm font-mono">
        <div class="flex items-center gap-1.5 bg-app-capooBg border border-app-capooBorder px-3 py-1.5 rounded-full text-app-capooText shadow-sm">
          <span>🇻🇳 HN:</span>

  <!-- Header Section -->
  <header class="max-w-3xl mx-auto px-4 pt-10 pb-6 text-center">

  <!-- Main Chat Stream Container -->
  <main class="max-w-3xl mx-auto px-4 md:px-6">

  <!-- Sticky Bottom Composer Bar -->

    <div class="max-w-3xl mx-auto pointer-events-auto">
      
      <!-- Card soạn tin khi đã đăng nhập -->

        <!-- Controls -->

          <div class="flex items-center gap-2">
            <span id="activeUserBadge" class="text-xs font-bold px-3 py-1 rounded-full shadow-sm"></span>
            <span class="text-sm text-app-muted">nhắn tin...</span>
          </div>

        <button onclick="openLoginModal()" class="px-5 py-2 bg-app-primary text-white text-sm font-bold rounded-xl hover:bg-app-primaryHover transition shadow-md w-full md:w-auto">

  <!-- Login Modal Popup -->

        <p class="text-sm text-app-muted mt-1">Chọn nhân vật của bạn</p>

      <form id="loginForm" class="space-y-5">

          <label class="cursor-pointer">
            <input type="radio" name="loginUser" value="capoo" checked class="peer hidden">
            <div class="p-3 text-center rounded-2xl border-2 border-app-border text-sm peer-checked:bg-app-capooBg peer-checked:border-app-capooBorder peer-checked:text-app-capooText font-bold transition shadow-sm">
              🐱 Capoo

          <label class="cursor-pointer">
            <input type="radio" name="loginUser" value="princess" class="peer hidden">
            <div class="p-3 text-center rounded-2xl border-2 border-app-border text-sm peer-checked:bg-app-princessBg peer-checked:border-app-princessBorder peer-checked:text-app-princessText font-bold transition shadow-sm">

        <div>
          <input 
            type="password" 
            id="loginPassword" 
            required 
            placeholder="Nhập mật khẩu..." 
            class="w-full px-4 py-3 rounded-xl border border-app-border bg-gray-50/50 text-base focus:bg-white focus:outline-none focus:border-app-primary focus:ring-2 focus:ring-app-primary/20 transition shadow-inner"

          <p class="text-xs text-app-muted mt-2 text-center font-mono">(Pass: capoo123 / princess123)</p>

        <button

  <!-- JavaScript Logic -->
  <script>
    // =========================================================================
    // 1. CẤU HÌNH FIREBASE REALTIME DATABASE 
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyApXsxyEbrH9W30KVyINT9_H3VXqP8Ko5Y",
      authDomain: "princessmeomeo.firebaseapp.com",
      databaseURL: "https://princessmeomeo-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "princessmeomeo",
      storageBucket: "princessmeomeo.firebasestorage.app",
      messagingSenderId: "240385247065",
      appId: "1:240385247065:web:8c69b3f83dadce03c06e48",
      measurementId: "G-L4L79M7BMQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // =========================================================================
    // 2. TÀI KHOẢN & PHÂN QUYỀN
    // =========================================================================
    const ACCOUNTS = {
      capoo: {
        id: 'capoo',
        name: 'Capoo 🐱🐛',
        password: 'capoo123',
        badgeClass: 'bg-app-capooBg text-app-capooText border border-app-capooBorder'
      },
      princess: {
        id: 'princess',
        name: 'Công Chúa 👑🎀',
        password: 'princess123',
        badgeClass: 'bg-app-princessBg text-app-princessText border border-app-princessBorder'
      }
    };

    let currentUser = JSON.parse(localStorage.getItem('notion_duo_user')) || null;

    // =========================================================================
    // 3. LIVE DUAL CLOCKS (HÀ NỘI & PARIS)
    // =========================================================================
    function updateDualClocks() {
      const now = new Date();
      const timeVN = new Intl.DateTimeFormat('vi-VN', {
        timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', hour12: false
      }).format(now);

      const timeFR = new Intl.DateTimeFormat('fr-FR', {
        timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', hour12: false
      }).format(now);

      document.getElementById('clockVN').textContent = timeVN;
      document.getElementById('clockFR').textContent = timeFR;
    }
    setInterval(updateDualClocks, 1000);
    updateDualClocks();

    function formatDualTimestamp(timestamp) {
      const d = new Date(timestamp);
      const opt = { hour: '2-digit', minute: '2-digit', hour12: false };
      const vnTime = new Intl.DateTimeFormat('vi-VN', { ...opt, timeZone: 'Asia/Ho_Chi_Minh' }).format(d);
      const frTime = new Intl.DateTimeFormat('fr-FR', { ...opt, timeZone: 'Europe/Paris' }).format(d);
      return `<span>🇻🇳 ${vnTime}</span> <span class="opacity-40 px-1">•</span> <span>🇫🇷 ${frTime}</span>`;
    }

    function formatDateHeader(timestamp) {
      const d = new Date(timestamp);
      return `${d.getDate()} tháng ${d.getMonth() + 1}, ${d.getFullYear()}`;
    }

    // =========================================================================
    // 4. QUẢN LÝ ĐĂNG NHẬP
    // =========================================================================
    const loginModal = document.getElementById('loginModal');
    const loginForm = document.getElementById('loginForm');
    const authStatus = document.getElementById('authStatus');
    const composerCard = document.getElementById('composerCard');
    const loginPrompt = document.getElementById('loginPrompt');
    const activeUserBadge = document.getElementById('activeUserBadge');

    function openLoginModal() { loginModal.classList.remove('hidden'); }
    function closeLoginModal() { loginModal.classList.add('hidden'); }

    function updateAuthUI() {
      if (currentUser) {
        authStatus.innerHTML = `
          <span class="font-bold text-app-text flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-app-primary animate-pulse"></span>
            ${currentUser.name}
          </span>
          <button onclick="logout()" class="text-xs font-semibold text-app-muted hover:text-app-primary transition">Đăng xuất</button>
        `;
        composerCard.classList.remove('hidden');
        loginPrompt.classList.add('hidden');
        activeUserBadge.className = `text-xs font-bold px-3 py-1 rounded-full ${ACCOUNTS[currentUser.id].badgeClass}`;
        activeUserBadge.textContent = currentUser.name;
      } else {
        authStatus.innerHTML = `
          <button onclick="openLoginModal()" class="px-4 py-2 bg-app-primary text-white font-semibold rounded-xl hover:bg-app-primaryHover transition">
            <i class="fa-solid fa-arrow-right-to-bracket mr-1.5"></i> Đăng nhập
          </button>
        `;
        composerCard.classList.add('hidden');
        loginPrompt.classList.remove('hidden');
      }
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const selectedId = document.querySelector('input[name="loginUser"]:checked').value;
      const pass = document.getElementById('loginPassword').value.trim();

      if (pass === ACCOUNTS[selectedId].password) {
        currentUser = ACCOUNTS[selectedId];
        localStorage.setItem('notion_duo_user', JSON.stringify(currentUser));
        closeLoginModal();
        loginForm.reset();
        updateAuthUI();
        if (latestChatData) renderChatStream(latestChatData);
      } else {
        alert("Mật khẩu không đúng rồi nè!");
      }
    });

    window.logout = function() {
      currentUser = null;
      localStorage.removeItem('notion_duo_user');
      updateAuthUI();
      if (latestChatData) renderChatStream(latestChatData);
    };

    updateAuthUI();

    // =========================================================================
    // 5. SOẠN TIN & NÉN ẢNH
    // =========================================================================
    const msgType = document.getElementById('msgType');
    const msgContent = document.getElementById('msgContent');
    const imagePickerContainer = document.getElementById('imagePickerContainer');
    const imageFileInput = document.getElementById('imageFileInput');
    const imgLabel = document.getElementById('imgLabel');
    const removeImgBtn = document.getElementById('removeImgBtn');
    const imgThumbPreview = document.getElementById('imgThumbPreview');
    const sendBtn = document.getElementById('sendBtn');

    let base64Image = null;

    msgType.addEventListener('change', () => {
      if (msgType.value === 'image') {
        imagePickerContainer.classList.remove('hidden');
        msgContent.placeholder = "Viết chú thích kèm theo ảnh (tùy chọn)...";
      } else {
        imagePickerContainer.classList.add('hidden');
        msgContent.placeholder = "Gửi một mẩu tâm sự, việc cần làm hay lời nhắn...";
      }
    });

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxWidth = 1000;
            let width = img.width, height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
          };
        };
        reader.onerror = (err) => reject(err);
      });
    }

    imageFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      imgLabel.textContent = "Đang xử lý ảnh...";
      base64Image = await compressImage(file);
      imgLabel.textContent = file.name.length > 15 ? file.name.substring(0, 12) + '...' : file.name;
      removeImgBtn.classList.remove('hidden');
      imgThumbPreview.classList.remove('hidden');
      imgThumbPreview.innerHTML = `<img src="${base64Image}" class="w-10 h-10 object-cover rounded-lg border border-app-border shadow-sm">`;
    });

    removeImgBtn.addEventListener('click', () => {
      base64Image = null;
      imageFileInput.value = '';
      imgLabel.textContent = "Chọn ảnh...";
      removeImgBtn.classList.add('hidden');
      imgThumbPreview.innerHTML = '';
      imgThumbPreview.classList.add('hidden');
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    window.toggleTodo = function(key, currentStatus) {
      db.ref(`duo_chat_stream/${key}/completed`).set(!currentStatus);
    };

    window.deleteMessage = function(key, authorId) {
      if (!currentUser || currentUser.id !== authorId) {
        alert("Bạn chỉ có thể xóa tin nhắn của chính mình!");
        return;
      }
      if (confirm("Xóa tin nhắn này khỏi nhật ký?")) {
        db.ref(`duo_chat_stream/${key}`).remove();
      }
    };

    sendBtn.addEventListener('click', async () => {
      if (!currentUser) {
        openLoginModal();
        return;
      }

      const type = msgType.value;
      const content = msgContent.value.trim();

      if (type === 'image' && !base64Image) {
        alert("Vui lòng chọn một bức ảnh trước khi gửi!");
        return;
      }
      if (type !== 'image' && !content) {
        return;
      }

      sendBtn.disabled = true;

      try {
        await db.ref('duo_chat_stream').push({
          authorId: currentUser.id,
          authorName: currentUser.name,
          type,
          content: content || null,
          image: base64Image || null,
          completed: false,
          createdAt: Date.now()
        });

        msgContent.value = '';
        removeImgBtn.click();
        if (msgType.value === 'image') {
          msgType.value = 'text';
          imagePickerContainer.classList.add('hidden');
        }

        setTimeout(() => scrollToBottom(true), 200);

      } catch (err) {
        alert("Lỗi khi gửi: " + err.message);
      } finally {
        sendBtn.disabled = false;
      }
    });

    // =========================================================================
    // 6. RENDER CHAT STREAM 
    // =========================================================================
    const chatFeed = document.getElementById('chatFeed');
    let latestChatData = null;

    function scrollToBottom(smooth = false) {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: smooth ? 'smooth' : 'auto'
      });
    }

    function renderChatStream(data) {
      latestChatData = data;
      chatFeed.innerHTML = '';

      if (!data || Object.keys(data).length === 0) {
        chatFeed.innerHTML = `
          <div class="text-center py-20 border-2 border-dashed border-white/50 rounded-3xl p-8 bg-white/40 backdrop-blur-md shadow-sm">
            <img src="https://media.tenor.com/PsmK0Q8g9CgAAAAi/capoo-blue.gif" class="w-16 h-16 mx-auto mb-4 opacity-80 drop-shadow-sm">
            <p class="font-serif text-xl text-app-text font-bold">Chưa có dòng tâm sự nào...</p>
            <p class="text-sm text-app-text mt-2">Capoo & Công Chúa hãy gửi lời nhắn đầu tiên nhé!</p>
          </div>
        `;
        return;
      }

      const messageList = Object.keys(data).map(key => ({
        key,
        ...data[key]
      })).sort((a, b) => a.createdAt - b.createdAt);

      let lastDateString = "";

      messageList.forEach(item => {
        const isCapoo = item.authorId === 'capoo';
        const isOwner = currentUser && currentUser.id === item.authorId;

        // Header ngày tháng
        const itemDateStr = formatDateHeader(item.createdAt);
        if (itemDateStr !== lastDateString) {
          lastDateString = itemDateStr;
          const dateDivider = document.createElement('div');
          dateDivider.className = "flex items-center justify-center my-8";
          dateDivider.innerHTML = `
            <span class="text-sm font-mono font-semibold text-app-text bg-white/80 backdrop-blur-sm border border-white px-5 py-2 rounded-full shadow-sm">
              ✨ ${itemDateStr} ✨
            </span>
          `;
          chatFeed.appendChild(dateDivider);
        }

        // Nội dung tin nhắn (Font to, rõ ràng)
        let bodyHtml = '';
        if (item.type === 'text') {
          bodyHtml = `<p class="text-[15px] sm:text-base leading-relaxed whitespace-pre-line">${escapeHtml(item.content)}</p>`;
        } else if (item.type === 'todo') {
          bodyHtml = `
            <div class="flex items-start gap-3">
              <input 
                type="checkbox" 
                ${item.completed ? 'checked' : ''} 
                onchange="toggleTodo('${item.key}', ${item.completed})" 
                class="chat-checkbox flex-shrink-0"
              >
              <span class="text-[15px] sm:text-base ${item.completed ? 'line-through opacity-60' : ''} transition leading-relaxed">${escapeHtml(item.content)}</span>
            </div>`;
        } else if (item.type === 'callout') {
          bodyHtml = `
            <div class="flex items-start gap-3 p-4 rounded-xl bg-white/70 border border-black/5 text-[15px] sm:text-base shadow-sm">
              <span class="mt-0.5 text-lg">${isCapoo ? '🐱' : '🎀'}</span>
              <p class="leading-relaxed whitespace-pre-line font-semibold text-app-text">${escapeHtml(item.content)}</p>
            </div>`;
        } else if (item.type === 'image') {
          bodyHtml = `
            <div class="space-y-3">
              <img src="${item.image}" loading="lazy" class="w-full max-h-96 object-cover rounded-xl border border-black/5 shadow-sm">
              ${item.content ? `<p class="text-[15px] sm:text-base italic opacity-90">${escapeHtml(item.content)}</p>` : ''}
            </div>`;
        }

        // Tạo Bong Bóng Chat
        const row = document.createElement('div');
        row.className = `flex items-end gap-3 ${isCapoo ? 'justify-start' : 'justify-end'} group`;

        const bubbleTheme = isCapoo 
          ? 'bg-app-capooBg border-app-capooBorder text-app-capooText rounded-tl-2xl rounded-tr-2xl rounded-br-2xl rounded-bl-sm' 
          : 'bg-app-princessBg border-app-princessBorder text-app-princessText rounded-tl-2xl rounded-tr-2xl rounded-bl-2xl rounded-br-sm';

        // Avatar to hơn
        const avatar = isCapoo 
          ? `<div class="w-10 h-10 rounded-full bg-white border border-app-capooBorder flex items-center justify-center text-base flex-shrink-0 mb-1 shadow-sm">🐱</div>`
          : `<div class="w-10 h-10 rounded-full bg-white border border-app-princessBorder flex items-center justify-center text-base flex-shrink-0 mb-1 shadow-sm">👑</div>`;

        const bubbleContent = `
          <div class="max-w-[85%] sm:max-w-[75%]">
            <div class="text-xs font-bold mb-1.5 px-1.5 opacity-60 flex items-center gap-1.5 ${isCapoo ? 'justify-start' : 'justify-end'}">
              <span>${escapeHtml(item.authorName)}</span>
            </div>

            <div class="chat-bubble p-4 border ${bubbleTheme}">
              ${bodyHtml}
              
              <div class="flex items-center justify-between gap-4 text-[11px] opacity-70 font-mono mt-3 pt-2 border-t border-black/10">
                <div class="flex items-center gap-1.5">${formatDualTimestamp(item.createdAt)}</div>
                ${isOwner ? `
                  <button onclick="deleteMessage('${item.key}', '${item.authorId}')" class="text-app-muted hover:text-red-500 font-bold transition hover:scale-110" title="Xóa tin nhắn">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                  </button>` : ''}
              </div>
            </div>
          </div>
        `;

        if (isCapoo) {
          row.innerHTML = avatar + bubbleContent;
        } else {
          row.innerHTML = bubbleContent + avatar;
        }

        chatFeed.appendChild(row);
      });
    }

    db.ref('duo_chat_stream').on('value', (snapshot) => {
      renderChatStream(snapshot.val());
    });
  </script>
</body>
</html>
