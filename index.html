<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chérie • capoo & me</title>

  <!-- Google Fonts: Editorial Serif & Minimal Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rosewater: '#FDF7F4',
            coquette: {
              50: '#FAF2F0',
              100: '#F5E4E2',
              200: '#ECC5C1',
              300: '#E2A59F',
              400: '#D67E77',
              500: '#C25952',
              dark: '#4A2828'
            },
            capoo: {
              light: '#E6F4FE',
              DEFAULT: '#8EC5FC',
              dark: '#4B9CD3',
              accent: '#3A86C8'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cormorant Garamond"', 'serif'],
            cursive: ['"Alex Brush"', 'cursive']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF5F2;
      background-image: 
        radial-gradient(at 0% 0%, rgba(245, 228, 226, 0.7) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(230, 244, 254, 0.6) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(253, 247, 244, 0.8) 0px, transparent 100%);
      min-height: 100vh;
      color: #4A3B39;
    }

    .glass-box {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 36px -8px rgba(194, 89, 82, 0.08);
    }

    .editorial-border {
      border: 1px solid rgba(214, 126, 119, 0.2);
    }

    /* Hiệu ứng nhún nhảy nhẹ của Capoo */
    @keyframes capooWiggle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(3deg); }
    }
    .capoo-bounce {
      animation: capooWiggle 3s ease-in-out infinite;
    }
  </style>

  <!-- Firebase SDK (Realtime Database 100% Miễn phí) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body class="font-sans antialiased py-10 px-4 md:px-6">

  <div class="max-w-2xl mx-auto">

    <!-- Header Section -->
    <header class="text-center mb-10 relative">
      <div class="inline-flex items-center justify-center space-x-2 text-xs tracking-widest uppercase font-semibold text-coquette-400 mb-2">
        <span>—</span>
        <span>Notre Journal Intime</span>
        <span>—</span>
      </div>
      
      <h1 class="font-serif text-4xl md:text-5xl font-semibold tracking-tight text-coquette-dark flex items-center justify-center gap-3">
        <span>chérie</span>
        <span class="font-cursive text-3xl md:text-4xl text-capoo-dark transform -rotate-6">et</span>
        <span>capoo</span>
      </h1>
      
      <p class="mt-2 text-xs text-coquette-dark/60 tracking-wider">
        nhật ký ngọt ngào của công chúa & chú mèo sâu bọ ham ăn 🍖🎀
      </p>

      <!-- Bugcat Capoo Badge -->
      <div class="mt-4 inline-flex items-center gap-2 bg-white/80 editorial-border px-4 py-1.5 rounded-full shadow-sm text-xs text-coquette-500">
        <img src="https://media.tenor.com/PsmK0Q8g9CgAAAAi/capoo-blue.gif" alt="Bugcat Capoo" class="w-6 h-6 object-contain capoo-bounce">
        <span class="tracking-wide font-medium text-capoo-dark">Bugcat Capoo's Sanctuary</span>
        <span class="text-xs">🍖✨</span>
      </div>
    </header>

    <!-- Editor Form -->
    <section class="glass-box rounded-3xl p-6 md:p-8 mb-12 relative transition-all duration-300">
      <form id="entryForm" class="space-y-5">
        
        <!-- Toggle Tác giả: Capoo & Princess -->
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-widest text-coquette-dark/70 mb-2">
            Ai đang viết thế? 🪞
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="author" value="Bugcat Capoo 🐱🐛" checked class="peer hidden">
              <div class="p-2.5 text-center rounded-2xl border border-capoo-light bg-white/40 text-xs font-medium text-capoo-dark peer-checked:bg-capoo-light peer-checked:border-capoo-dark peer-checked:font-semibold transition-all flex items-center justify-center gap-2">
                <span>🐱🐛 Capoo đói bụng</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="author" value="Princess 👑🎀" class="peer hidden">
              <div class="p-2.5 text-center rounded-2xl border border-coquette-200/80 bg-white/40 text-xs font-medium text-coquette-dark peer-checked:bg-coquette-100 peer-checked:border-coquette-400 peer-checked:font-semibold transition-all flex items-center justify-center gap-2">
                <span>👑 Công chúa nhỏ</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Mood & Tags phong cách Capoo -->
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-widest text-coquette-dark/70 mb-2">
            Tâm trạng lúc này
          </label>
          <div class="flex flex-wrap gap-2 text-xs">
            <label class="cursor-pointer">
              <input type="radio" name="mood" value="🍖 Thèm ăn thịt" checked class="peer hidden">
              <span class="px-3 py-1.5 rounded-full border border-coquette-200 bg-white/50 inline-block peer-checked:bg-capoo-dark peer-checked:text-white peer-checked:border-capoo-dark transition text-[11px]">
                🍖 Thèm thịt
              </span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="mood" value="🎀 Rất nhớ bạn" class="peer hidden">
              <span class="px-3 py-1.5 rounded-full border border-coquette-200 bg-white/50 inline-block peer-checked:bg-coquette-400 peer-checked:text-white peer-checked:border-coquette-400 transition text-[11px]">
                🎀 Rất nhớ bạn
              </span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="mood" value="💤 Muốn ngủ nướng" class="peer hidden">
              <span class="px-3 py-1.5 rounded-full border border-coquette-200 bg-white/50 inline-block peer-checked:bg-coquette-400 peer-checked:text-white peer-checked:border-coquette-400 transition text-[11px]">
                💤 Muốn ngủ
              </span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="mood" value="🌸 Hôm nay vui vẻ" class="peer hidden">
              <span class="px-3 py-1.5 rounded-full border border-coquette-200 bg-white/50 inline-block peer-checked:bg-coquette-400 peer-checked:text-white peer-checked:border-coquette-400 transition text-[11px]">
                🌸 Vui vẻ
              </span>
            </label>
          </div>
        </div>

        <!-- Text Area -->
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-widest text-coquette-dark/70 mb-2">
            Trang nhật ký
          </label>
          <textarea 
            id="messageInput" 
            rows="3" 
            required
            placeholder="Kể cho Capoo hoặc công chúa nghe hôm nay có gì đặc biệt nào..." 
            class="w-full px-4 py-3.5 rounded-2xl bg-white/70 border border-coquette-200/80 focus:border-coquette-400 focus:bg-white focus:outline-none text-xs leading-relaxed transition"
          ></textarea>
        </div>

        <!-- Media Attachment -->
        <div class="space-y-3 pt-1">
          <div class="flex items-center justify-between">
            <label class="text-[11px] font-semibold uppercase tracking-widest text-coquette-dark/70">
              Đính kèm kỷ niệm
            </label>
            <span class="text-[10px] text-coquette-400">Tự động nén ảnh nét & nhẹ ✨</span>
          </div>

          <div class="flex items-center space-x-3">
            <label for="imageFileInput" class="cursor-pointer inline-flex items-center gap-2 px-3.5 py-2 bg-white rounded-xl editorial-border text-xs text-coquette-dark/80 hover:bg-coquette-50 transition shadow-sm">
              <i class="fa-regular fa-image text-coquette-400"></i>
              <span id="fileLabel">Chọn ảnh từ máy...</span>
            </label>
            <input type="file" id="imageFileInput" accept="image/*" class="hidden">
            <button type="button" id="removeFileBtn" class="hidden text-xs text-gray-400 hover:text-red-500">
              <i class="fa-solid fa-xmark"></i> Hủy ảnh
            </button>
          </div>

          <div>
            <input 
              type="url" 
              id="mediaUrlInput" 
              placeholder="Hoặc dán link video (YouTube/mp4) hoặc ảnh gif Capoo online..." 
              class="w-full px-3.5 py-2 rounded-xl bg-white/60 border border-coquette-200/60 focus:border-coquette-400 focus:bg-white focus:outline-none text-[11px] transition"
            >
          </div>

          <div id="imagePreview" class="hidden pt-2"></div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full py-3.5 bg-gradient-to-r from-coquette-400 to-coquette-500 hover:from-coquette-500 hover:to-coquette-400 active:scale-[0.99] text-white font-medium text-xs tracking-wider uppercase rounded-2xl shadow-sm transition duration-200 flex items-center justify-center space-x-2"
        >
          <span>Gửi vào trang nhật ký</span>
          <span class="text-sm">💌</span>
        </button>
      </form>
    </section>

    <!-- Timeline Entries -->
    <section>
      <div class="flex items-center justify-between mb-6 px-1 border-b border-coquette-200/50 pb-3">
        <h2 class="font-serif text-2xl font-semibold text-coquette-dark flex items-center gap-2">
          <span>Mémoires</span>
          <span id="postCount" class="text-xs font-sans font-normal px-2 py-0.5 bg-coquette-100 text-coquette-dark rounded-full">0</span>
        </h2>
        <span class="text-[11px] text-coquette-dark/50 italic font-serif">synced with capoo & you</span>
      </div>

      <div id="postsList" class="space-y-6">
        <div class="text-center py-16 text-coquette-300">
          <i class="fa-solid fa-spinner fa-spin text-xl"></i>
          <p class="text-xs mt-2 tracking-wide">Đang mở quyển nhật ký...</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="text-center mt-20 text-[11px] text-coquette-dark/40 tracking-widest uppercase">
      <p>Bugcat Capoo & Princess • Minimalist Archive</p>
    </footer>

  </div>

  <script>
    // =========================================================================
    // CẤU HÌNH FIREBASE REALTIME DATABASE (PRINCESSMEOMEO - SINGAPORE)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyApXsxyEbrH9W30KVyINT9_H3VXqP8Ko5Y",
      authDomain: "princessmeomeo.firebaseapp.com",
      databaseURL: "https://princessmeomeo-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "princessmeomeo",
      storageBucket: "princessmeomeo.firebasestorage.app",
      messagingSenderId: "240385247065",
      appId: "1:240385247065:web:8c69b3f83dadce03c06e48",
      measurementId: "G-L4L79M7BMQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // DOM Elements
    const entryForm = document.getElementById('entryForm');
    const postsList = document.getElementById('postsList');
    const postCount = document.getElementById('postCount');
    const imageFileInput = document.getElementById('imageFileInput');
    const fileLabel = document.getElementById('fileLabel');
    const removeFileBtn = document.getElementById('removeFileBtn');
    const imagePreview = document.getElementById('imagePreview');
    const mediaUrlInput = document.getElementById('mediaUrlInput');
    const submitBtn = document.getElementById('submitBtn');

    let compressedImageBase64 = null;

    // Nén ảnh sang JPEG nhẹ
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxWidth = 1000;
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            resolve(dataUrl);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    imageFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        fileLabel.textContent = 'Đang nén ảnh...';
        compressedImageBase64 = await compressImage(file);
        
        fileLabel.textContent = file.name.length > 18 ? file.name.substring(0, 15) + '...' : file.name;
        removeFileBtn.classList.remove('hidden');
        imagePreview.classList.remove('hidden');
        imagePreview.innerHTML = `<img src="${compressedImageBase64}" class="max-h-48 rounded-xl object-cover border border-coquette-200 shadow-sm">`;
      } catch (err) {
        alert("Không thể đọc ảnh, vui lòng thử lại!");
        removeFileBtn.click();
      }
    });

    removeFileBtn.addEventListener('click', () => {
      compressedImageBase64 = null;
      imageFileInput.value = '';
      fileLabel.textContent = 'Chọn ảnh từ máy...';
      removeFileBtn.classList.add('hidden');
      imagePreview.innerHTML = '';
      imagePreview.classList.add('hidden');
    });

    function formatTime(timestamp) {
      const d = new Date(timestamp);
      const day = d.getDate().toString().padStart(2, '0');
      const month = (d.getMonth() + 1).toString().padStart(2, '0');
      const hours = d.getHours().toString().padStart(2, '0');
      const mins = d.getMinutes().toString().padStart(2, '0');
      return `${day}.${month} • ${hours}:${mins}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Reaction: Tim hoặc Cho Capoo ăn thịt 🍖
    window.reactHeart = function(key) {
      const entryRef = db.ref(`diary_entries/${key}/hearts`);
      entryRef.transaction((current) => (current || 0) + 1);
    };

    window.reactMeat = function(key) {
      const entryRef = db.ref(`diary_entries/${key}/meats`);
      entryRef.transaction((current) => (current || 0) + 1);
    };

    // Render danh sách
    function renderFeed(entries) {
      postsList.innerHTML = '';
      const keys = Object.keys(entries || {}).reverse();
      postCount.textContent = keys.length;

      if (keys.length === 0) {
        postsList.innerHTML = `
          <div class="text-center py-16 bg-white/40 rounded-3xl editorial-border p-8">
            <img src="https://media.tenor.com/PsmK0Q8g9CgAAAAi/capoo-blue.gif" class="w-16 h-16 mx-auto mb-2 opacity-80" alt="Capoo">
            <p class="font-serif text-lg text-coquette-dark">Chưa có mẩu tâm sự nào...</p>
            <p class="text-xs text-coquette-dark/60 mt-1">Capoo & Công chúa hãy là người viết trang nhật ký đầu tiên nhé 🍖</p>
          </div>
        `;
        return;
      }

      keys.forEach(key => {
        const item = entries[key];
        const isCapoo = item.author && item.author.includes('Capoo');
        
        const card = document.createElement('article');
        card.className = "glass-box rounded-3xl p-6 relative transition hover:shadow-md";

        let mediaHtml = '';
        if (item.image) {
          mediaHtml = `
            <div class="mt-3 overflow-hidden rounded-2xl border border-coquette-100">
              <img src="${item.image}" loading="lazy" class="w-full max-h-96 object-cover hover:scale-[1.01] transition duration-300">
            </div>`;
        } else if (item.externalUrl) {
          const url = item.externalUrl;
          if (url.includes('youtube.com') || url.includes('youtu.be')) {
            let videoId = url.includes('youtu.be') ? url.split('/').pop() : url.split('v=')[1]?.split('&')[0];
            mediaHtml = `
              <div class="mt-3 overflow-hidden rounded-2xl border border-coquette-100 aspect-video">
                <iframe src="https://www.youtube.com/embed/${videoId}" class="w-full h-full rounded-2xl" allowfullscreen></iframe>
              </div>`;
          } else if (url.match(/\.(mp4|webm)$/i)) {
            mediaHtml = `
              <div class="mt-3 overflow-hidden rounded-2xl border border-coquette-100 bg-black/5">
                <video src="${url}" controls class="w-full max-h-96 rounded-2xl"></video>
              </div>`;
          } else {
            mediaHtml = `
              <div class="mt-3 overflow-hidden rounded-2xl border border-coquette-100">
                <img src="${url}" loading="lazy" class="w-full max-h-96 object-cover">
              </div>`;
          }
        }

        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-coquette-100/60 pb-3 mb-3">
            <div class="flex items-center space-x-2.5">
              <span class="w-7 h-7 rounded-full ${isCapoo ? 'bg-capoo-light text-capoo-dark' : 'bg-coquette-100 text-coquette-dark'} flex items-center justify-center text-xs">
                ${isCapoo ? '🐱🐛' : '👑'}
              </span>
              <div>
                <span class="text-xs font-semibold ${isCapoo ? 'text-capoo-dark' : 'text-coquette-dark'}">${escapeHtml(item.author || '')}</span>
                <span class="text-[10px] text-coquette-dark/40 ml-2 font-mono">${formatTime(item.createdAt)}</span>
              </div>
            </div>
            <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-white editorial-border text-coquette-500 font-medium">
              ${escapeHtml(item.mood || '🍖')}
            </span>
          </div>

          <p class="text-xs text-coquette-dark/90 leading-relaxed whitespace-pre-line">${escapeHtml(item.message)}</p>

          ${mediaHtml}

          <!-- Reactions: Tim & Thịt Capoo -->
          <div class="mt-4 pt-2 flex items-center justify-end space-x-2">
            <button onclick="reactMeat('${key}')" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/70 editorial-border text-xs text-capoo-dark hover:bg-capoo-light transition active:scale-95">
              <span>🍖</span>
              <span class="text-[11px] font-semibold">${item.meats || 0}</span>
            </button>
            <button onclick="reactHeart('${key}')" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/70 editorial-border text-xs text-coquette-400 hover:text-coquette-500 hover:bg-coquette-50 transition active:scale-95">
              <span>💖</span>
              <span class="text-[11px] font-semibold">${item.hearts || 0}</span>
            </button>
          </div>
        `;
        postsList.appendChild(card);
      });
    }

    // Lắng nghe realtime
    db.ref('diary_entries').on('value', (snapshot) => {
      renderFeed(snapshot.val());
    }, (error) => {
      postsList.innerHTML = `<div class="text-center text-xs text-red-500 p-4">Lỗi kết nối: ${error.message}</div>`;
    });

    // Submit
    entryForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const author = document.querySelector('input[name="author"]:checked').value;
      const mood = document.querySelector('input[name="mood"]:checked').value;
      const message = document.getElementById('messageInput').value.trim();
      const externalUrl = mediaUrlInput.value.trim();

      if (!message) return;

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

      try {
        await db.ref('diary_entries').push({
          author,
          mood,
          message,
          image: compressedImageBase64 || null,
          externalUrl: externalUrl || null,
          hearts: 0,
          meats: 0,
          createdAt: Date.now()
        });

        entryForm.reset();
        removeFileBtn.click();
        mediaUrlInput.value = '';
      } catch (err) {
        alert("Lỗi khi gửi bài: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    });
  </script>
</body>
</html>
